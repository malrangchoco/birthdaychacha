<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#f8f4e8" />
  <title>생일 롤링페이퍼</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Nanum+Pen+Script&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <main class="page">
    <header class="top">
      <p class="eyebrow">HAPPY BIRTHDAY ♡</p>
      <h1 id="title">생일 축하해!</h1>
      <p class="intro" id="intro">한 장의 종이에 우리 마음을 모아보자.</p>
    </header>
    <section class="paper" aria-label="함께 쓰는 롤링페이퍼">
      <div class="paper-top"><span>TO. <b id="recipient">오늘의 주인공</b></span><span class="spark">✳ ✴ ✳</span></div>
      <div class="notes" id="notes" aria-live="polite"></div>
      <form id="writeForm" class="compose">
        <div class="compose-heading"><span class="plus">✎</span> 나도 한마디 남기기</div>
        <label for="writer">FROM.</label>
        <input id="writer" name="writer" maxlength="20" placeholder="이름이나 별명" autocomplete="nickname" required />
        <label for="message">MESSAGE.</label>
        <textarea id="message" name="message" maxlength="600" rows="4" placeholder="생일 축하해! 하고 싶은 말을 적어줘 :)" required></textarea>
        <input class="honey" type="text" id="website" name="website" tabindex="-1" autocomplete="off" aria-hidden="true" />
        <div class="form-bottom"><span id="count">0 / 600</span><button id="submit" type="submit">종이에 붙이기 ↗</button></div>
        <p id="status" class="status" role="status"></p>
      </form>
    </section>
    <footer>마음은 모일수록 커지니까 ♡ <button id="share" type="button">링크 복사</button></footer>
  </main>
  <script src="/config.js"></script>
  <script src="/app.js"></script>
</body>
</html>
